<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>برنامج الحسابات - الأمين</title>
<style>
:root{--navy:#061d39;--navy2:#092b50;--gold:#f3c65b;--gold2:#ffe39a;--line:#b9862c;--cream:#fff8e8;--ink:#14263b}
*{box-sizing:border-box}body{margin:0;background:#071a31;color:#fff;font-family:Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
#login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#173c61,#06172c 65%)}
.login-card{width:min(420px,92vw);padding:28px;border:2px solid var(--gold);border-radius:18px;background:linear-gradient(145deg,#092b50,#03142a);box-shadow:0 0 35px #d49a3840;text-align:center}
.login-card h1{color:var(--gold2);margin:8px 0 24px}.login-card label{display:block;text-align:right;margin:12px 0 6px;color:#ffe6a6}
.login-card input{width:100%;padding:13px;border-radius:8px;border:1px solid var(--line);background:#fffaf0;color:#18283b}
.gold-btn{background:linear-gradient(#ffe59b,#d69b2e);border:1px solid #fff0b5;color:#17253b;font-weight:bold;border-radius:9px;padding:11px 18px}
#app{display:none;min-height:100vh;background:#061a32}
.topbar{height:42px;background:#03162d;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:var(--gold2);font-weight:bold}
.window-actions{display:flex;gap:6px}.window-actions span{border:1px solid #9c722d;padding:2px 10px;border-radius:5px}
.navbar{display:flex;align-items:stretch;gap:2px;background:linear-gradient(90deg,#04172e,#0a2b4e);border:2px solid var(--line);border-radius:10px;margin:4px 5px;padding:3px;min-height:86px}
.brand{display:flex;align-items:center;gap:10px;padding:8px 16px;color:var(--gold2);font-size:18px;min-width:210px}
.navitems{display:flex;flex:1;justify-content:space-around;flex-wrap:wrap}.navitems button{background:transparent;border:0;border-left:1px solid #9b722e;color:var(--gold2);font-weight:bold;min-width:105px;padding:7px 12px}
.navitems button span{display:block;font-size:26px;margin-bottom:3px}.navitems button:hover,.navitems button.active{background:#173d63;border-radius:7px}
.userbox{min-width:180px;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;border-right:1px solid #9c722d;padding:8px}.avatar{font-size:34px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 225px;direction:ltr;gap:5px;margin:5px;min-height:calc(100vh - 210px)}
.main{direction:rtl;min-width:0;background:#f6eddb;border:2px solid var(--line);border-radius:10px;overflow:hidden;color:var(--ink)}
.toolbar{display:flex;gap:8px;padding:7px;background:#082746;border-bottom:2px solid var(--line)}
.toolbar input{flex:1;min-width:100px;padding:11px;border-radius:7px;border:1px solid #b98b3e;background:#fffaf0}
.toolbar button{min-width:100px}
.side{direction:rtl;background:linear-gradient(#061f3d,#04162c);border:2px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.side button{background:linear-gradient(110deg,#092b50,#06172c);color:#ffe6a2;border:1px solid #bd8b35;border-radius:10px;padding:13px 10px;text-align:right;font-weight:bold;font-size:15px;min-height:63px}
.side button b{font-size:25px;vertical-align:middle;margin-left:12px;color:var(--gold)}

<script>
const KEY='alameen_browser_app_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{user:'جورجيوس الروماني',password:'123456',products:[],customers:[],suppliers:[],sales:[],purchases:[],expenses:[]};
let modalSave=null;
db.expenses=db.expenses||[];
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function login(){let u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value;if(u===db.user&&p===db.password){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('currentUser').textContent=db.user;showPage('home')}else document.getElementById('loginError').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'}
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
function logout(){document.getElementById('app').style.display='none';document.getElementById('login').style.display='grid';document.getElementById('loginPass').value=''}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return (Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م'}
function showPage(page){
 document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));
 const c=document.getElementById('content');
 if(page==='home'){c.innerHTML=`<div class="hero"><div class="hero-note">مرحباً بك في برنامج الأمين<br><small>نظام إدارة الحسابات والمخازن</small></div></div><div class="page"><div class="cards">${stat('عدد المنتجات',db.products.length)}${stat('إجمالي المبيعات',money(sum(db.sales)))}${stat('إجمالي المشتريات',money(sum(db.purchases)))}${stat('العملاء',db.customers.length)}</div></div>`;return}
 if(page==='inventory')return listPage('المنتجات','products',['name','code','quantity','buy','sell'],'إضافة منتج');
 if(page==='customers')return listPage('العملاء','customers',['name','phone','address','balance'],'إضافة عميل');
 if(page==='suppliers')return listPage('الموردون','suppliers',['name','phone','address','balance'],'إضافة مورد');
 if(page==='sales'||page==='purchases')return invoicePage(page);
 if(page==='reports')return reportsPage();
 if(page==='profits')return profitsPage();
 if(page==='calculator')return calculatorPage();
 if(page==='accounts')return accountsPage();
 if(page==='users')return settingsPage(true);
 if(page==='settings')return settingsPage(false);
}
function stat(a,b){return `<div class="stat">${a}<strong>${b}</strong></div>`}
function sum(arr){return arr.reduce((s,x)=>s+Number(x.total||0),0)}
const labels={name:'الاسم',code:'كود المنتج',quantity:'الكمية',buy:'سعر الشراء',sell:'سعر البيع',phone:'رقم الهاتف',address:'العنوان',balance:'الرصيد'};
function listPage(title,key,fields,addText){
 let rows=db[key].map((x,i)=>`<tr>${fields.map(f=>`<td>${esc(f==='buy'||f==='sell'||f==='balance'?money(x[f]):x[f])}</td>`).join('')}<td><button class="small-btn" onclick="editItem('${key}',${i})">تعديل</button> <button class="small-btn danger" onclick="delItem('${key}',${i})">حذف</button></td></tr>`).join('');
 document.getElementById('content').innerHTML=`<div class="page"><h2>${title}</h2><div class="actions"><button class="gold-btn" onclick="editItem('${key}',-1)">${addText}</button><button class="small-btn" onclick="backup()">تصدير نسخة احتياطية</button></div><div class="tablewrap"><table><thead><tr>${fields.map(f=>`<th>${labels[f]||f}</th>`).join('')}<th>إجراءات</th></tr></thead><tbody>${rows||`<tr><td colspan="${fields.length+1}">لا توجد بيانات بعد — اضغط إضافة للبدء</td></tr>`}</tbody></table></div></div>`;
}
function editItem(key,i){let fields=key==='products'?['name','code','quantity','buy','sell']:['name','phone','address','balance'],old=i<0?{}:db[key][i];
 let body='<div class="formgrid">'+fields.map(f=>`<label>${labels[f]}<input id="f_${f}" value="${esc(old[f]??'')}" ${['quantity','buy','sell','balance'].includes(f)?'type="number" step="0.01"':''}></label>`).join('')+'</div>';
 openModal(i<0?'إضافة جديد':'تعديل البيانات',body,()=>{let obj={};fields.forEach(f=>obj[f]=document.getElementById('f_'+f).value);fields.filter(f=>['quantity','buy','sell','balance'].includes(f)).forEach(f=>obj[f]=Number(obj[f]||0));if(!obj.name){toast('يرجى إدخال الاسم');return false}if(i<0)db[key].push(obj);else db[key][i]=obj;persist();showPage(key==='products'?'inventory':key);toast('تم حفظ البيانات');return true})}
function delItem(key,i){if(confirm('هل تريد حذف هذا السجل؟')){db[key].splice(i,1);persist();showPage(key==='products'?'inventory':key);toast('تم الحذف')}}
function invoicePage(type){let key=type==='sales'?'sales':'purchases',title=type==='sales'?'فواتير المبيعات':'فواتير المشتريات',rows=db[key].map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.party)}</td><td>${esc(x.product)}</td><td>${x.qty}</td><td>${money(x.total)}</td><td>${esc(x.date)}</td><td><button class="small-btn danger" onclick="deleteInvoice('${key}',${i})">حذف</button></td></tr>`).join('');
 document.getElementById('content').innerHTML=`<div class="page"><h2>${title}</h2><div class="actions"><button class="gold-btn" onclick="newInvoice('${key}')">إنشاء فاتورة</button></div><div class="tablewrap"><table><tr><th>م</th><th>العميل / المورد</th><th>المنتج</th><th>الكمية</th><th>الإجمالي</th><th>التاريخ</th><th>إجراء</th></tr>${rows||'<tr><td colspan="7">لا توجد فواتير</td></tr>'}</table></div></div>`}
function newInvoice(key){let body=`<div class="formgrid"><label>العميل / المورد<input id="party"></label><label>المنتج<select id="product">${db.products.map((p,i)=>`<option value="${i}">${esc(p.name)} — متاح ${p.quantity}</option>`).join('')}</select></label><label>الكمية<input id="qty" type="number" min="1" value="1"></label><label>السعر<input id="price" type="number" step="0.01"></label><label>التاريخ<input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></label></div><p style="color:#805510">سيتم تحديث كمية المخزون تلقائياً عند حفظ الفاتورة.</p>`;
 openModal(key==='sales'?'فاتورة مبيعات':'فاتورة مشتريات',body,()=>{let idx=Number(document.getElementById('product').value),p=db.products[idx],q=Number(document.getElementById('qty').value),price=Number(document.getElementById('price').value),party=document.getElementById('party').value.trim();if(!p||!party||q<=0||price<=0){toast('أكمل بيانات الفاتورة');return false}if(key==='sales'&&p.quantity<q){toast('الكمية بالمخزون غير كافية');return false}p.quantity+=key==='purchases'?q:-q;db[key].push({party,product:p.name,qty:q,price,total:q*price,date:document.getElementById('date').value,...(key==='sales'?{costPrice:Number(p.buy)||0}:{})});persist();closeModal();showPage(key);toast('تم حفظ الفاتورة وتحديث المخزون');return true});
 setTimeout(()=>{let s=document.getElementById('product');if(s)s.onchange=()=>{let p=db.products[Number(s.value)];document.getElementById('price').value=p?(key==='sales'?p.sell:p.buy):''};if(s)s.onchange()},0)}
function deleteInvoice(key,i){if(confirm('حذف الفاتورة؟ سيتم عكس أثر الكمية على المخزون.')){let x=db[key][i],p=db.products.find(p=>p.name===x.product);if(p)p.quantity+=key==='sales'?x.qty:-x.qty;db[key].splice(i,1);persist();showPage(key);}}
function reportsPage(){document.getElementById('content').innerHTML=`<div class="page"><h2>التقارير</h2><div class="cards">${stat('إجمالي المبيعات',money(sum(db.sales)))}${stat('إجمالي المشتريات',money(sum(db.purchases)))}${stat('عدد فواتير البيع',db.sales.length)}${stat('عدد فواتير الشراء',db.purchases.length)}</div><button class="gold-btn" onclick="window.print()">طباعة التقرير</button><h3>ملخص حركة المخزون</h3><div class="tablewrap"><table><tr><th>المنتج</th><th>الكمية الحالية</th><th>قيمة المخزون بسعر الشراء</th></tr>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.quantity}</td><td>${money(p.quantity*p.buy)}</td></tr>`).join('')||'<tr><td colspan="3">لا توجد منتجات</td></tr>'}</table></div></div>`}
function accountsPage(){document.getElementById('content').innerHTML=`<div class="page"><h2>الحسابات العامة</h2><div class="cards">${stat('إجمالي المبيعات',money(sum(db.sales)))}${stat('إجمالي المشتريات',money(sum(db.purchases)))}${stat('الفرق التقريبي',money(sum(db.sales)-sum(db.purchases)))}</div><p>هذا ملخص مبسط لحركة البيع والشراء، وليس بديلاً عن دفتر محاسبي معتمد أو مراجعة محاسب.</p></div>`}

function invoiceProfit(x){
 const p=db.products.find(z=>z.name===x.product);
 const cost=Number(x.costPrice??p?.buy??0);
 return (Number(x.price)||0)*Number(x.qty||0)-cost*Number(x.qty||0);
}
function profitsPage(){
 const gross=db.sales.reduce((a,x)=>a+invoiceProfit(x),0);
 const expenses=db.expenses.reduce((a,x)=>a+Number(x.amount||0),0);
 const net=gross-expenses;
 const rows=db.expenses.map((x,i)=>`<tr><td>${esc(x.title)}</td><td>${money(x.amount)}</td><td>${esc(x.date)}</td><td><button class="small-btn danger" onclick="deleteExpense(${i})">حذف</button></td></tr>`).join('');
 const salesRows=db.sales.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.product)}</td><td>${x.qty}</td><td>${money(x.total)}</td><td>${money(invoiceProfit(x))}</td><td>${esc(x.date)}</td></tr>`).join('');
 document.getElementById('content').innerHTML=`<div class="page"><h2>الأرباح والمصروفات</h2>
 <div class="cards">${stat('إجمالي المبيعات',money(sum(db.sales)))}${stat('إجمالي الربح قبل المصروفات',money(gross))}${stat('إجمالي المصروفات',money(expenses))}${stat('صافي الربح',money(net))}</div>
 <div class="actions"><button class="gold-btn" onclick="addExpense()">＋ تسجيل مصروف</button><button class="small-btn" onclick="window.print()">طباعة التقرير</button></div>
 <h3>تفاصيل أرباح فواتير البيع</h3><div class="tablewrap"><table><tr><th>م</th><th>المنتج</th><th>الكمية</th><th>قيمة البيع</th><th>الربح</th><th>التاريخ</th></tr>${salesRows||'<tr><td colspan="6">لا توجد فواتير مبيعات بعد</td></tr>'}</table></div>
 <h3>المصروفات</h3><div class="tablewrap"><table><tr><th>البيان</th><th>المبلغ</th><th>التاريخ</th><th>إجراء</th></tr>${rows||'<tr><td colspan="4">لا توجد مصروفات مسجلة</td></tr>'}</table></div>
 <p style="font-size:13px;color:#795b2b">يُحسب ربح الفاتورة من سعر البيع مطروحاً منه سعر شراء المنتج وقت تسجيل الفاتورة. الفواتير القديمة التي لا تحتوي على تكلفة محفوظة تستخدم سعر الشراء الحالي للمنتج.</p></div>`;
}
function addExpense(){
 const body=`<div class="formgrid"><label>بيان المصروف<input id="expenseTitle" placeholder="مثال: إيجار أو كهرباء"></label><label>المبلغ<input id="expenseAmount" type="number" min="0.01" step="0.01"></label><label>التاريخ<input id="expenseDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label></div>`;
 openModal('تسجيل مصروف',body,()=>{const title=document.getElementById('expenseTitle').value.trim(),amount=Number(document.getElementById('expenseAmount').value),date=document.getElementById('expenseDate').value;if(!title||amount<=0){toast('أدخل بيان المصروف والمبلغ بشكل صحيح');return false}db.expenses.push({title,amount,date});persist();showPage('profits');toast('تم تسجيل المصروف');return true});
}
function deleteExpense(i){if(confirm('هل تريد حذف هذا المصروف؟')){db.expenses.splice(i,1);persist();showPage('profits');toast('تم حذف المصروف')}}
function calculatorPage(){
 document.getElementById('content').innerHTML=`<div class="page"><h2>الآلة الحاسبة</h2><div style="max-width:390px;margin:20px auto;background:#092746;border:2px solid #bd8b35;border-radius:14px;padding:16px;box-shadow:0 8px 22px #0003">
 <input id="calcDisplay" readonly value="0" style="width:100%;height:62px;margin-bottom:12px;text-align:left;direction:ltr;font-size:27px;padding:10px;border-radius:8px;border:1px solid #bd8b35;background:#fffaf0;color:#14263b">
 <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
 ${[['C','clear'],['⌫','back'],['%','percent'],['÷','/'],['7','7'],['8','8'],['9','9'],['×','*'],['4','4'],['5','5'],['6','6'],['−','-'],['1','1'],['2','2'],['3','3'],['+','+'],['±','sign'],['0','0'],['.','.'],['=','=']].map(([label,val])=>`<button class="gold-btn" style="min-height:52px;font-size:20px" onclick="calcPress('${val}')">${label}</button>`).join('')}
 </div></div></div>`;
}
let calcExpression='';
function calcPress(key){
 const d=document.getElementById('calcDisplay');if(!d)return;
 if(key==='clear'){calcExpression='';d.value='0';return}
 if(key==='back'){calcExpression=calcExpression.slice(0,-1);d.value=calcExpression||'0';return}
 if(key==='sign'){if(calcExpression.startsWith('-'))calcExpression=calcExpression.slice(1);else calcExpression='-'+calcExpression;d.value=calcExpression||'0';return}
 if(key==='percent'){try{calcExpression=String(Number(Function('"use strict";return ('+calcExpression+')')())/100);d.value=calcExpression}catch(_){d.value='خطأ';calcExpression=''}return}
 if(key==='='){try{if(!/^[0-9+*/().\-\s]+$/.test(calcExpression))throw 0;const result=Function('"use strict";return ('+calcExpression+')')();if(!Number.isFinite(result))throw 0;calcExpression=String(Math.round((result+Number.EPSILON)*1e10)/1e10);d.value=calcExpression}catch(_){d.value='خطأ';calcExpression=''}return}
 calcExpression+=key;d.value=calcExpression;
}

function settingsPage(users){document.getElementById('content').innerHTML=`<div class="page"><h2>${users?'إدارة المستخدم':'الإعدادات'}</h2><div class="formgrid"><label>اسم المستخدم<input id="newUser" value="${esc(db.user)}"></label><label>كلمة المرور الجديدة<input id="newPass" type="password" placeholder="اتركها فارغة للإبقاء على الحالية"></label></div><button class="gold-btn" onclick="saveSettings()">حفظ الإعدادات</button><hr><h3>النسخ الاحتياطي</h3><button class="small-btn" onclick="backup()">تنزيل نسخة احتياطية JSON</button> <label class="small-btn" style="display:inline-block">استعادة نسخة<input type="file" accept=".json,application/json" style="display:none" onchange="restore(event)"></label><p style="font-size:13px;color:#795b2b">تنبيه: البيانات محفوظة على هذا المتصفح والجهاز فقط. استخدم النسخ الاحتياطي بانتظام.</p></div>`}
function saveSettings(){let u=document.getElementById('newUser').value.trim(),p=document.getElementById('newPass').value;if(!u){toast('اسم المستخدم مطلوب');return}db.user=u;if(p)db.password=p;persist();document.getElementById('currentUser').textContent=u;toast('تم تحديث الإعدادات')}
function openModal(title,body,fn){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;modalSave=fn;document.getElementById('modal').style.display='grid'}
function closeModal(){document.getElementById('modal').style.display='none';modalSave=null}
function saveModal(){if(modalSave&&modalSave()!==false)closeModal()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='alameen-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('تم تجهيز النسخة الاحتياطية')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.products||!d.sales)throw 0;db=d;db.expenses=db.expenses||[];persist();toast('تمت استعادة البيانات');showPage('home')}catch(_){toast('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(f)}
function globalSearch(){let q=document.getElementById('globalQuery').value.trim().toLowerCase();if(!q)return;let found=db.products.filter(p=>(p.name+' '+p.code).toLowerCase().includes(q));document.getElementById('content').innerHTML=`<div class="page"><h2>نتائج البحث</h2><div class="tablewrap"><table><tr><th>المنتج</th><th>الكود</th><th>الكمية</th><th>سعر البيع</th></tr>${found.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.code)}</td><td>${p.quantity}</td><td>${money(p.sell)}</td></tr>`).join('')||'<tr><td colspan="4">لا توجد نتائج للمنتجات</td></tr>'}</table></div></div>`}
function clock(){document.getElementById('clock').textContent=new Date().toLocaleString('ar-EG')}
clock();setInterval(clock,1000);
</script></body></html>
